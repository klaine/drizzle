# Build and test Drizzle on every push and pull request; on a v* tag, attach the module package and
# the single-file browser synth to the GitHub release (plan/02 section 6).
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install zig
        run: pip install ziglang==0.17.1
      - name: Build and test
        run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drizzle
          path: |
            drizzle-module.tar.gz
            build/drizzle.html
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            drizzle-module.tar.gz
            build/drizzle.html
